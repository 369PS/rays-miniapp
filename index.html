<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAYS — Бронювання залу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F3F3F1;
      --text: #111111;
      --muted: #767676;
      --line: #CFCFC9;
      --busy-bg: #E2E2DE;
      --busy-text: #9A9A95;
      --accent: #111111;
      --accent-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    body {
      margin: 0;
      padding: 24px 18px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 0 0 20px;
      line-height: 1.15;
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 18px 0;
    }

    .label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .halls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hall-btn {
      background: transparent;
      border: 1px solid var(--text);
      color: var(--text);
      padding: 0;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.15s, color 0.15s;
    }

    .hall-thumb {
      width: 100%;
      height: 105px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--line);
      background: #E5E5E0;
    }

    .hall-meta {
      padding: 12px;
    }

    .hall-num {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .hall-name {
      display: block;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .hall-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .hall-btn.active .hall-thumb {
      border-bottom-color: #2B2B2B;
    }

    input[type="date"],
    input[type="text"],
    input[type="tel"],
    select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--text);
      outline: none;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 34px;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "↓";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      color: var(--text);
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    select option:disabled {
      background: var(--busy-bg);
      color: var(--busy-text);
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-top: 12px;
    }

    .slot-pill {
      border: 1px solid var(--line);
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      color: var(--text);
      background: transparent;
    }

    .slot-pill.busy {
      background: var(--busy-bg);
      border-color: var(--busy-bg);
      color: var(--busy-text);
      text-decoration: line-through;
    }

    .slot-pill.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--line);
      display: inline-block;
    }

    .dot.busy {
      background: var(--busy-bg);
      border-color: var(--busy-bg);
    }

    .dot.sel {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      height: 50px;
      margin-top: 8px;
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-secondary {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .summary-box {
      border: 1px solid var(--line);
      padding: 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">RAYS PHOTO STUDIO</div>
    <h1>Бронювання залу</h1>

    <!-- ШАГ 1 -->
    <div id="step1" class="step active">
      <div class="section">
        <span class="label">Оберіть зал</span>
        <div class="halls">
          <button type="button" class="hall-btn active" data-hall="cyclorama" data-hall-title="Зал 1 — Циклорама">
            <img class="hall-thumb" id="imgCyclorama" alt="Циклорама" />
            <span class="hall-meta">
              <span class="hall-num">Зал 1</span>
              <span class="hall-name">Циклорама</span>
            </span>
          </button>

          <button type="button" class="hall-btn" data-hall="interior" data-hall-title="Зал 2 — Інтер'єр">
            <img class="hall-thumb" id="imgInterior" alt="Інтер'єр" />
            <span class="hall-meta">
              <span class="hall-num">Зал 2</span>
              <span class="hall-name">Інтер'єр</span>
            </span>
          </button>
        </div>
      </div>

      <div class="section">
        <label class="label" for="bookingDate">Дата зйомки</label>
        <input type="date" id="bookingDate" />
      </div>

      <div class="section">
        <span class="label">Час оренди (09:00 — 21:00, крок 1 година)</span>
        <div class="time-grid">
          <div>
            <label class="label" for="startSelect">З</label>
            <div class="select-wrap">
              <select id="startSelect"></select>
            </div>
          </div>
          <div>
            <label class="label" for="endSelect">До</label>
            <div class="select-wrap">
              <select id="endSelect"></select>
            </div>
          </div>
        </div>

        <div class="timeline" id="timeline"></div>
        <div class="legend">
          <span><i class="dot"></i> Вільно</span>
          <span><i class="dot busy"></i> Заброньовано</span>
          <span><i class="dot sel"></i> Обрано</span>
        </div>
      </div>

      <button type="button" class="btn-primary" id="toStep2Btn">Забронювати</button>
      <div class="status" id="status1"></div>
    </div>

    <!-- ШАГ 2 -->
    <div id="step2" class="step">
      <div class="section">
        <button type="button" class="btn-secondary" id="backBtn" style="margin-top:0; margin-bottom:14px;">← Змінити час або зал</button>
        <div class="summary-box" id="summaryBox"></div>

        <div class="field-group">
          <label class="label" for="clientName">Ім'я</label>
          <input type="text" id="clientName" placeholder="Введіть ваше ім'я" />
        </div>

        <div class="field-group">
          <label class="label" for="clientPhone">Номер телефону</label>
          <input type="tel" id="clientPhone" placeholder="+380 (__) ___ __ __" />
          <button type="button" class="btn-secondary" id="sharePhoneBtn">Підтягнути / поділитися номером з Telegram</button>
        </div>

        <button type="button" class="btn-primary" id="payBtn">Перейти до оплати</button>
        <div class="status" id="status2"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Проверка занятости через Google Apps Script (без траты операций Make)
    const AVAILABILITY_URL = "https://script.google.com/macros/s/AKfycbwpgM4LYMrjTPr_5GNrOqzzAhnafV9_5MaN-FuRu-ydtVNeziezz03ya78Y1c4RdiTvaw/exec";

    // Отправка заявки на бронирование и оплату в Make
    const MAKE_BOOKING_URL = "https://hook.eu1.make.com/od3b3co8mr71bl85oz4eml4sd4nodfhh";

    // Прямые HTTPS-ссылки на фото залов (если пустые — блоки картинок скрываются автоматически)
    const CYCLORAMA_IMG = "";
    const INTERIOR_IMG = "";

    // Запасная ссылка на оплату, если Make не вернёт payment_url
    const FALLBACK_PAYMENT_URL = "";

    const OPEN_HOUR = 9;
    const CLOSE_HOUR = 21;

    let selectedHall = "cyclorama";
    let selectedHallTitle = "Зал 1 — Циклорама";
    let busyHours = [];

    const imgCyclorama = document.getElementById("imgCyclorama");
    const imgInterior = document.getElementById("imgInterior");
    const dateInput = document.getElementById("bookingDate");
    const startSelect = document.getElementById("startSelect");
    const endSelect = document.getElementById("endSelect");
    const timelineEl = document.getElementById("timeline");
    const status1 = document.getElementById("status1");
    const status2 = document.getElementById("status2");
    const toStep2Btn = document.getElementById("toStep2Btn");
    const step1El = document.getElementById("step1");
    const step2El = document.getElementById("step2");
    const backBtn = document.getElementById("backBtn");
    const summaryBox = document.getElementById("summaryBox");
    const clientNameInput = document.getElementById("clientName");
    const clientPhoneInput = document.getElementById("clientPhone");
    const sharePhoneBtn = document.getElementById("sharePhoneBtn");
    const payBtn = document.getElementById("payBtn");

    function initImages() {
      if (CYCLORAMA_IMG) {
        imgCyclorama.src = CYCLORAMA_IMG;
      } else {
        imgCyclorama.style.display = "none";
      }
      if (INTERIOR_IMG) {
        imgInterior.src = INTERIOR_IMG;
      } else {
        imgInterior.style.display = "none";
      }
    }

    function pad(h) {
      return String(h).padStart(2, "0") + ":00";
    }

    function getLocalToday() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now - offset).toISOString().split("T")[0];
    }

    function autofillTelegramUser() {
      const user = tg?.initDataUnsafe?.user;
      if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(" ");
        if (fullName && !clientNameInput.value) {
          clientNameInput.value = fullName;
        }
      }
    }

    function normalizeBusyHours(raw) {
      if (!raw) return [];
      const items = Array.isArray(raw) ? raw : String(raw).split(",");
      const hours = new Set();

      for (const item of items) {
        const str = String(item).trim();
        if (!str) continue;

        const rangeMatch = str.match(/^(\d{1,2})(?::\d{2})?\s*[-–—]\s*(\d{1,2})(?::\d{2})?\$/);
        if (rangeMatch) {
          const startH = Number(rangeMatch[1]);
          const endH = Number(rangeMatch[2]);
          for (let h = startH; h < endH; h++) {
            if (h >= OPEN_HOUR && h < CLOSE_HOUR) hours.add(h);
          }
          continue;
        }

        const singleMatch = str.match(/\d{1,2}/);
        if (singleMatch) {
          const h = Number(singleMatch[0]);
          if (!Number.isNaN(h) && h >= OPEN_HOUR && h < CLOSE_HOUR) {
            hours.add(h);
          }
        }
      }

      return Array.from(hours).sort((a, b) => a - b);
    }

    function populateStartHours(preferredStart = null) {
      startSelect.innerHTML = "";
      let firstFree = null;

      for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
        const isBusy = busyHours.includes(h);
        if (!isBusy && firstFree === null) firstFree = h;

        const opt = document.createElement("option");
        opt.value = String(h);
        opt.textContent = isBusy ? `${pad(h)} — зайнято` : pad(h);
        opt.disabled = isBusy;
        startSelect.appendChild(opt);
      }

      if (firstFree === null) {
        startSelect.innerHTML = `<option value="">Немає вільних годин</option>`;
        endSelect.innerHTML = `<option value="">—</option>`;
        toStep2Btn.disabled = true;
        renderTimeline(null, null);
        return;
      }

      toStep2Btn.disabled = false;
      const chosenStart =
        preferredStart !== null && !busyHours.includes(Number(preferredStart))
          ? Number(preferredStart)
          : firstFree;

      startSelect.value = String(chosenStart);
      populateEndHours(chosenStart);
    }

    function populateEndHours(startHour) {
      endSelect.innerHTML = "";
      if (startHour === null || Number.isNaN(startHour)) return;

      for (let endH = startHour + 1; endH <= CLOSE_HOUR; endH++) {
        if (busyHours.includes(endH - 1)) break;

        const opt = document.createElement("option");
        opt.value = String(endH);
        opt.textContent = pad(endH);
        endSelect.appendChild(opt);
      }

      if (endSelect.options.length > 0) {
        endSelect.value = endSelect.options[0].value;
      }

      renderTimeline(Number(startSelect.value), Number(endSelect.value));
    }

    function renderTimeline(startH, endH) {
      timelineEl.innerHTML = "";
      for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {
        const pill = document.createElement("div");
        pill.className = "slot-pill";
        pill.textContent = pad(h);

        if (busyHours.includes(h)) {
          pill.classList.add("busy");
        } else if (startH !== null && endH !== null && h >= startH && h < endH) {
          pill.classList.add("selected");
        }

        timelineEl.appendChild(pill);
      }
    }

    async function loadAvailability() {
      const dateVal = dateInput.value;
      if (!dateVal) return;

      status1.textContent = "Перевіряємо розклад...";
      try {
        const res = await fetch(AVAILABILITY_URL, {
          method: "POST",
          headers: { "Content-Type": "text
