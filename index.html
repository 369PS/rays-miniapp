<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAYS — Выбор даты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label {
      font-size: 14px;
      font-weight: 600;
    }
    input[type="date"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      box-sizing: border-box;
      background: var(--tg-theme-secondary-bg-color, #f7f7f7);
      color: var(--tg-theme-text-color, #111111);
    }
    button {
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
    }
    .status {
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>RAYS — Выберите дату</h2>
    <label for="bookingDate">Дата съёмки</label>
    <input type="date" id="bookingDate" />
    <button id="sendBtn" type="button">Проверить дату</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const WEBHOOK_URL = "https://hook.eu1.make.com/od3b3co8mr71bl85oz4eml4sd4nodfhh";
    const dateInput = document.getElementById("bookingDate");
    const statusEl = document.getElementById("status");

    // Подставляем сегодняшнюю дату по умолчанию и запрещаем выбор прошедших дней
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;
    dateInput.min = today;

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const selectedDate = dateInput.value;
      if (!selectedDate) {
        statusEl.textContent = "Сначала выберите дату.";
        return;
      }

      statusEl.textContent = "Отправляем дату...";

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            date: selectedDate,
            tg_user_id: tg.initDataUnsafe?.user?.id || null,
            tg_username: tg.initDataUnsafe?.user?.username || null
          })
        });

        if (response.ok) {
          statusEl.textContent = `Дата \${selectedDate} отправлена в календарь.`;
        } else {
          statusEl.textContent = "Ошибка при отправке. Попробуйте ещё раз.";
        }
      } catch (err) {
        statusEl.textContent = "Нет связи с сервером.";
      }
    });
  </script>
</body>
</html>
