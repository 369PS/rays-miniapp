<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAYS — Бронювання залу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F3F3F1;
      --text: #111111;
      --muted: #767676;
      --line: #CFCFC9;
      --busy-bg: #E2E2DE;
      --busy-text: #9A9A95;
      --accent: #111111;
      --accent-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    body {
      margin: 0;
      padding: 24px 18px 36px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 0 0 22px;
      line-height: 1.15;
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 18px 0;
    }

    .label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .halls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hall-btn {
      background: transparent;
      border: 1px solid var(--text);
      color: var(--text);
      padding: 14px 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .hall-btn .hall-num {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .hall-btn .hall-name {
      display: block;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .hall-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    input[type="date"],
    select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--text);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "↓";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      color: var(--text);
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    select option:disabled {
      background: var(--busy-bg);
      color: var(--busy-text);
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-top: 12px;
    }

    .slot-pill {
      border: 1px solid var(--line);
      padding: 6px 2px;
      text-align: center;
      font-size: 11px;
      color: var(--text);
      background: transparent;
    }

    .slot-pill.busy {
      background: var(--busy-bg);
      border-color: var(--busy-bg);
      color: var(--busy-text);
      text-decoration: line-through;
    }

    .slot-pill.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--line);
      display: inline-block;
    }

    .dot.busy {
      background: var(--busy-bg);
      border-color: var(--busy-bg);
    }

    .dot.sel {
      background: var(--accent);
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">RAYS PHOTO STUDIO</div>
    <h1>Бронювання залу</h1>

    <div class="section">
      <span class="label">Оберіть зал</span>
      <div class="halls">
        <button type="button" class="hall-btn active" data-hall="cyclorama" data-hall-title="Зал 1 — Циклорама">
          <span class="hall-num">Зал 1</span>
          <span class="hall-name">Циклорама</span>
        </button>
        <button type="button" class="hall-btn" data-hall="interior" data-hall-title="Зал 2 — Інтер'єр">
          <span class="hall-num">Зал 2</span>
          <span class="hall-name">Інтер'єр</span>
        </button>
      </div>
    </div>

    <div class="section">
      <label class="label" for="bookingDate">Дата зйомки</label>
      <input type="date" id="bookingDate" />
    </div>

    <div class="section">
      <span class="label">Час оренди (09:00 — 21:00)</span>
      <div class="time-grid">
        <div>
