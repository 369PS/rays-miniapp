<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAYS — Бронювання залу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F3F3F1;
      --text: #111111;
      --muted: #767676;
      --line: #CFCFC9;
      --busy-bg: #E2E2DE;
      --busy-text: #9A9A95;
      --accent: #111111;
      --accent-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 24px 18px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 0 0 20px;
      line-height: 1.15;
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 18px 0;
      min-width: 0;
    }

    .label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .halls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hall-btn {
      background: transparent;
      border: 1px solid var(--text);
      color: var(--text);
      padding: 0;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      transition: background 0.15s, color 0.15s;
    }

    .hall-thumb {
      width: 100%;
      height: 105px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--line);
      background: #E5E5E0;
    }

    .hall-meta {
      padding: 12px;
    }

    .hall-num {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .hall-name {
      display: block;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .hall-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .hall-btn.active .hall-thumb {
      border-bottom-color: #2B2B2B;
    }

    input[type="date"],
    input[type="text"],
    input[type="tel"],
    select {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 46px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--text);
      outline: none;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      line-height: 44px;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 34px;
    }

    .select-wrap {
      position: relative;
      min-width: 0;
    }

    .select-wrap::after {
      content: "↓";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      color: var(--text);
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-width: 0;
    }

    .time-grid > div {
      min-width: 0;
    }

    select option:disabled {
      background: var(--busy-bg);
      color: var(--busy-text);
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-top: 12px;
    }

    .slot-pill {
      position: relative;
      border: 1px solid var(--line);
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text);
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    .slot-half {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 1;
      pointer-events: none;
    }

    .slot-half.left {
      left: 0;
    }

    .slot-half.right {
      right: 0;
    }

    .slot-half.busy {
      background: var(--busy-bg);
    }

    .slot-half.selected {
      background: var(--accent);
    }

    .slot-label {
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .slot-label-selected-clip {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-text);
      pointer-events: none;
      clip-path: inset(0 100% 0 0);
    }

    .slot-pill.full-busy .slot-label {
      color: var(--busy-text);
      text-decoration: line-through;
    }

    .slot-pill.full-selected .slot-label-selected-clip {
      clip-path: inset(0 0 0 0);
    }

    .slot-pill.half-left-selected .slot-label-selected-clip {
      clip-path: inset(0 50% 0 0);
    }

    .slot-pill.half-right-selected .slot-label-selected-clip {
      clip-path: inset(0 0 0 50%);
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--line);
      display: inline-block;
    }

    .dot.busy {
      background: var(--busy-bg);
      border-color: var(--busy-bg);
    }

    .dot.sel {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary {
      width: 100%;
      height: 50px;
      margin-top: 8px;
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
      font-family: inherit;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-secondary {
      width: 100%;
      height: 44px;
      margin-top: 8px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .summary-box {
      border: 1px solid var(--line);
      padding: 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">RAYS PHOTO STUDIO</div>
    <h1>Бронювання залу</h1>

    <div id="step1" class="step active">
      <div class="section">
        <span class="label">Оберіть зал</span>
        <div class="halls">
          <button type="button" class="hall-btn active" data-hall="cyclorama" data-hall-title="Зал 1 — Циклорама">
            <img class="hall-thumb" id="imgCyclorama" alt="Циклорама" />
            <span class="hall-meta">
              <span class="hall-num">Зал 1</span>
              <span class="hall-name">Циклорама</span>
            </span>
          </button>

          <button type="button" class="hall-btn" data-hall="interior" data-hall-title="Зал 2 — Інтер'єр">
            <img class="hall-thumb" id="imgInterior" alt="Інтер'єр" />
            <span
